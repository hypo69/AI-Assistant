# Файл: apps/pdf_wasm_converter/rust_engine/Cargo.toml
# Назначение: Конфигурация крейта Rust для сборки PDF-конвертера в WebAssembly
# Updated: 2026-10-27 21:17:00

[package]
name = "pdf-wasm-engine"
version = "0.1.0"
edition = "2021"
authors = ["hypo69"]
description = "Высокоскоростной клиентский движок обработки PDF на базе Rust и WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
lopdf = { version = "0.33", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "s" # Оптимизация размера WebAssembly бинарника
lto = true
codegen-units = 1
