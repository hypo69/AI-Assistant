<div class="ai-modal-overlay d-none" id="ai-modal-overlay">
  <div class="ai-modal-card shadow-lg p-3">
    <div class="ai-modal-header d-flex justify-content-between align-items-center pb-2 border-bottom">
      <h5 class="mb-0 text-info fw-bold" id="ai-modal-header-title">🤖 Паспорт процесса</h5>
      <button type="button" class="btn-close" id="btn-close-ai-modal" aria-label="Закрыть"></button>
    </div>
    <div class="ai-modal-body py-3" id="ai-modal-body-content">
      <!-- Динамический контент заполняется через AIModalDialog.open() -->

      <div id="ai-modal-actions" class="d-flex gap-2"></div>
      <button type="button" class="btn btn-sm btn-secondary" id="btn-dismiss-ai-modal">Закрыть</button>
    </div>
  </div>
</div>
