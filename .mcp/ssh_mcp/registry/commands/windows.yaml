    name: Запуск службы Windows
    platform: windows
    category: services
    executor: powershell
    privilege: administrator
    risk_level: medium
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters:
      service_name:
        type: string
        required: true

  - id: windows.service.stop
    name: Остановка службы Windows
    platform: windows
    category: services
    executor: powershell
    privilege: administrator
    risk_level: high
    timeout: 30
    requires_confirmation: true
    audit: true
    parameters:
      service_name:
        type: string
        required: true

  - id: windows.service.restart
    name: Перезапуск службы Windows
    platform: windows
    category: services
    executor: powershell
    privilege: administrator
    risk_level: high
    timeout: 30
    requires_confirmation: true
    audit: true
    parameters:
      service_name:
        type: string
        required: true

  - id: windows.service.enable
    name: Включение автозапуска службы Windows
    platform: windows
    category: services
    executor: powershell
    privilege: administrator
    risk_level: high
    timeout: 30
    requires_confirmation: true
    audit: true
    parameters:
      service_name:
        type: string
        required: true

  - id: windows.service.disable
    name: Отключение автозапуска службы Windows
    platform: windows
    category: services
    executor: powershell
    privilege: administrator
    risk_level: high
    timeout: 30
    requires_confirmation: true
    audit: true
    parameters:
      service_name:
        type: string
        required: true

  - id: windows.user.list
    name: Список локальных пользователей Windows
    platform: windows
    category: users
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.user.create
    name: Создание локального пользователя Windows
    platform: windows
    category: users
    executor: powershell
    privilege: administrator
    risk_level: high
    timeout: 30
    requires_confirmation: true
    audit: true
    parameters:
      username:
        type: string
        required: true
      credential_ref:
        type: string
        required: true

  - id: windows.user.delete
    name: Удаление пользователя Windows
    platform: windows
    category: users
    executor: powershell
    privilege: administrator
    risk_level: critical
    timeout: 30
    requires_confirmation: true
    audit: true
    parameters:
      username:
        type: string
        required: true
