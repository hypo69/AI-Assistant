commands:
  - id: windows.system.info
    name: Сведения о системе Windows
    platform: windows
    category: system
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.system.cpu
    name: Загрузка и характеристики процессора Windows
    platform: windows
    category: system
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.system.memory
    name: Состояние оперативной памяти Windows
    platform: windows
    category: system
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.system.disks
    name: Логические тома и диски Windows
    platform: windows
    category: system
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.system.uptime
    name: Время непрерывной работы Windows
    platform: windows
    category: system
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.system.boot_info
    name: Сведения о загрузке ОС Windows
    platform: windows
    category: system
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.system.environment
    name: Переменные окружения Windows
    platform: windows
    category: system
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.process.list
    name: Список процессов Windows
    platform: windows
    category: processes
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.process.get
    name: Информация о процессе Windows
    platform: windows
    category: processes
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters:
      pid:
        type: integer
        required: true

  - id: windows.process.start
    name: Запуск процесса Windows
    platform: windows
    category: processes
    executor: powershell
    privilege: standard
    risk_level: medium
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters:
      executable:
        type: string
        required: true
      arguments:
        type: list
        required: false

  - id: windows.process.stop
    name: Остановка процесса Windows
    platform: windows
    category: processes
    executor: powershell
    privilege: administrator
    risk_level: high
    timeout: 30
    requires_confirmation: true
    audit: true
    parameters:
      pid:
        type: integer
        required: true

  - id: windows.process.tree
    name: Дерево процессов Windows
    platform: windows
    category: processes
    executor: powershell
    privilege: standard
    risk_level: low
    timeout: 30
    requires_confirmation: false
    audit: true
    parameters: {}

  - id: windows.process.resource_usage
    name: Топ потребления ресурсов процессами Windows
    platform: windows
    category: processes
    executor: powershell
    privilege: standard
